<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kode masuk Tali</title>
</head>
<body style="margin:0;padding:0;background:#F6F5FA;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F5FA;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E3E1EE;border-radius:16px;">
          <tr>
            <td style="background:#24206B;border-radius:16px 16px 0 0;padding:24px;" align="left">
              <img src="{{ .SiteURL }}/icons/icon-192.png" width="40" height="40" alt="Tali" style="display:block;border:0;border-radius:10px;">
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px 8px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;color:#1A174F;">
              <h1 style="margin:0 0 8px;font-size:24px;line-height:32px;font-weight:700;">Kode masuk Tali kamu</h1>
              <p style="margin:0;font-size:16px;line-height:24px;color:#4A4870;">Masukkan kode ini di halaman masuk Tali.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;">
              <div style="background:#F6F5FA;border:1px solid #E3E1EE;border-radius:12px;padding:20px;text-align:center;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:36px;line-height:44px;font-weight:800;letter-spacing:10px;color:#24206B;font-variant-numeric:tabular-nums;">{{ .Token }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 28px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#4A4870;">
              <p style="margin:0 0 12px;">Kode berlaku 1 jam dan hanya bisa dipakai sekali. Jangan bagikan kode ini ke siapa pun, termasuk yang mengaku dari tim Tali.</p>
              <p style="margin:0;">Tidak merasa meminta kode? Abaikan email ini. Akunmu tetap aman.</p>
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #E3E1EE;padding:16px 24px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#4A4870;">
              Tali · Tied to trust.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
